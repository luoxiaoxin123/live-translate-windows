name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart("v", "V")
          if ($ver -notmatch '^\d+\.\d+') {
            throw "Tag must look like v0.2.0, got '$tag'"
          }
          "version=$ver" >> $env:GITHUB_OUTPUT
          "APP_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Host "APP_VERSION=$ver"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./tools/pack.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LiveTranslate-windows
          path: |
            LiveTranslate-Setup-x64.exe
            LiveTranslate-win-x64.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $exists = $true
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { $exists = $false }
          if (-not $exists) {
            gh release create $tag --title $tag --generate-notes --verify-tag
          }
          gh release upload $tag LiveTranslate-Setup-x64.exe LiveTranslate-win-x64.zip --clobber
