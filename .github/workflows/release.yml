name: Pack

# Version always comes from GitHub Releases (including pre-releases), not csproj.
# That same number is stamped into the installer so Settings → Version matches.
#
# Official: merge to main, or publish a Release / Pre-release. Assets are uploaded
# to the newest matching Release when one exists.
# Debug: Actions → Pack → Run workflow from main, set "ref" to the feature branch.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch / tag / SHA to pack. Empty = the branch chosen above. Non-main builds a debug test package.'
        required: false
        type: string
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
  release:
    types: [published]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  pack:
    runs-on: windows-latest
    steps:
      - name: Resolve what to pack
        id: meta
        shell: pwsh
        run: |
          $event = "${{ github.event_name }}"
          if ($event -eq "release") {
            $requested = "${{ github.event.release.tag_name }}"
            $isOfficial = $true
          } else {
            $requested = "${{ inputs.ref }}".Trim()
            if ([string]::IsNullOrWhiteSpace($requested)) {
              $requested = "${{ github.ref_name }}"
            }
            $isOfficial = $requested -in @("main", "refs/heads/main")
          }

          $slug = ($requested -replace "^refs/heads/", "" -replace "[^A-Za-z0-9._-]+", "-").Trim("-")
          if ([string]::IsNullOrWhiteSpace($slug)) { $slug = "head" }

          "ref=$requested" >> $env:GITHUB_OUTPUT
          "official=$($isOfficial.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "slug=$slug" >> $env:GITHUB_OUTPUT
          Write-Host "event=$event pack ref=$requested official=$isOfficial"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.ref }}

      - name: Resolve version from latest GitHub Release
        id: ver
        shell: pwsh
        run: |
          $event = "${{ github.event_name }}"
          $releaseTag = ""
          if ($event -eq "release") {
            $releaseTag = "${{ github.event.release.tag_name }}"
          } else {
            $releaseTag = gh api "repos/${{ github.repository }}/releases?per_page=1" --jq ".[0].tag_name"
          }

          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            $releaseTag = (Select-Xml -Path "src\LiveTranslate.App\LiveTranslate.App.csproj" -XPath "//Version").Node.InnerText.Trim()
            if (-not $releaseTag.StartsWith("v")) { $releaseTag = "v$releaseTag" }
          }

          $base = $releaseTag.TrimStart("v", "V")
          if ($base -notmatch "^\d+\.\d+") {
            throw "Release tag must look like v0.2.1, got '$releaseTag'"
          }

          $official = "${{ steps.meta.outputs.official }}" -eq "true"
          $sha = (git rev-parse --short HEAD)
          $ver = if ($official) { $base } else { "$base-debug.${{ steps.meta.outputs.slug }}.$sha" }

          "version=$ver" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          Write-Host "release_tag=$releaseTag version=$ver"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./tools/pack.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Label debug artifacts
        if: steps.meta.outputs.official != 'true'
        shell: pwsh
        run: |
          Rename-Item LiveTranslate-Setup-x64.exe LiveTranslate-Setup-x64-debug.exe
          Rename-Item LiveTranslate-win-x64.zip LiveTranslate-win-x64-debug.zip

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.official == 'true' && 'LiveTranslate-windows' || format('LiveTranslate-windows-debug-{0}', steps.meta.outputs.slug) }}
          path: |
            LiveTranslate-Setup-x64*.exe
            LiveTranslate-win-x64*.zip
          if-no-files-found: error
          retention-days: ${{ steps.meta.outputs.official == 'true' && 90 || 14 }}

      - name: Attach official build to the Release
        if: steps.meta.outputs.official == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.release_tag }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No GitHub Release named $tag — left the installer as a workflow artifact only."
            exit 0
          }
          gh release upload $tag LiveTranslate-Setup-x64.exe LiveTranslate-win-x64.zip --clobber
          Write-Host "Uploaded installer to $tag"

      - name: Summary
        shell: pwsh
        run: |
          $kind = if ("${{ steps.meta.outputs.official }}" -eq "true") { "official" } else { "debug (test)" }
          @"
          ## Pack complete
          - Kind: $kind
          - Ref: `${{ steps.meta.outputs.ref }}`
          - Version stamped into Settings: `${{ steps.ver.outputs.version }}`
          - Release: `${{ steps.ver.outputs.release_tag }}`
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
